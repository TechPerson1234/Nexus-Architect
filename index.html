<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Architect | math12393</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        :root { --bg: #0d0e12; --card: #161b22; --accent: #238636; --text: #c9d1d9; --border: #30363d; --code: #000; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 20px auto; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 40px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1 { color: #fff; font-size: 2rem; margin-bottom: 5px; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; background: #21262d; font-size: 12px; color: var(--accent); border: 1px solid var(--accent); margin-bottom: 25px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full { grid-column: span 2; }
        label { display: block; margin: 15px 0 5px; font-weight: 600; font-size: 14px; }
        input, textarea, select { width: 100%; background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 12px; color: #fff; font-size: 15px; box-sizing: border-box; font-family: inherit; }
        input:focus, textarea:focus, select:focus { border-color: #58a6ff; outline: none; }
        select { cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c9d1d9' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em; }
        .options-row { display: flex; align-items: center; gap: 15px; margin: 25px 0; background: #21262d; padding: 15px; border-radius: 8px; }
        button#execBtn { background: var(--accent); color: #fff; border: none; padding: 18px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: 0.2s; }
        button#execBtn:hover { background: #2ea043; }
        .terminal { background: var(--code); color: #00ff41; padding: 15px; border-radius: 6px; font-family: 'Courier New', monospace; margin-top: 25px; border: 1px solid #333; display: none; height: 150px; overflow-y: auto; }
        .results-area { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; display: none; }
        .file-box { background: #0d1117; padding: 15px; border-radius: 8px; border: 1px solid var(--border); position: relative; overflow-x: auto; }
        pre { font-size: 13px; line-height: 1.5; color: #d1d5da; white-space: pre-wrap; margin: 10px 0 0; font-family: 'Courier New', Courier, monospace; }
        .copy-btn { position: absolute; top: 10px; right: 10px; background: #30363d; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; }
        .copy-btn:hover { background: #4b535d; }
    </style>
</head>
<body>

<div class="container">
    <h1>Nexus Architect <span style="font-weight:200; opacity:0.6;">// Agentic OS</span></h1>
    <div class="status-badge">AI Logic: GPT 120B | Smart Platform Routing | Core Year: 2026</div>

    <div class="form-grid">
        <div>
            <label>Target Platform <span style="font-weight:normal; opacity:0.5;">(e.g., GitHub, HuggingFace, Codeberg, Gitlab)</span></label>
            <input type="text" id="platform" placeholder="Codeberg" Value="Codeberg">
        </div>
        <div>
            <label>Open Source License <span style="font-weight:normal; opacity:0.5;">(Strict Selection)</span></label>
            <select id="license">
                <option value="MIT">MIT License</option>
                <option value="Apache-2.0">Apache License 2.0</option>
                <option value="GPL-3.0">GNU General Public License v3.0</option>
                <option value="GPL-2.0">GNU General Public License v2.0</option>
                <option value="GPL-1.0">GNU General Public License v1.0</option>
                <option value="AGPL-3.0">GNU Affero General Public License v3.0</option>
                <option value="LGPL-3.0">GNU Lesser General Public License v3.0</option>
                <option value="LGPL-2.1">GNU Lesser General Public License v2.1</option>
                <option value="BSD-3-Clause">BSD 3-Clause "New" or "Revised" License</option>
                <option value="BSD-2-Clause">BSD 2-Clause "Simplified" License</option>
                <option value="0BSD">BSD Zero Clause License</option>
                <option value="MPL-2.0">Mozilla Public License 2.0</option>
                <option value="MPL-1.1">Mozilla Public License 1.1</option>
                <option value="The Unlicense">The Unlicense (Public Domain)</option>
                <option value="CC0-1.0">Creative Commons Zero v1.0 Universal</option>
                <option value="WTFPL">Do What The F*ck You Want To Public License</option>
                <option value="ISC">ISC License</option>
                <option value="zlib">zlib License</option>
                <option value="BSL-1.0">Boost Software License 1.0</option>
                <option value="EPL-2.0">Eclipse Public License 2.0</option>
                <option value="EPL-1.0">Eclipse Public License 1.0</option>
                <option value="CDDL-1.1">Common Development and Distribution License 1.1</option>
                <option value="CDDL-1.0">Common Development and Distribution License 1.0</option>
                <option value="Artistic-2.0">Artistic License 2.0</option>
                <option value="Artistic-1.0">Artistic License 1.0</option>
                <option value="PHP-3.01">PHP License 3.01</option>
                <option value="Python-2.0">Python Software Foundation License 2.0</option>
                <option value="Vim">Vim License</option>
                <option value="Sleepycat">Sleepycat License</option>
                <option value="QPL-1.0">Q Public License 1.0</option>
                <option value="ZPL-2.1">Zope Public License 2.1</option>
                <option value="JSON">JSON License (The Software shall be used for Good, not Evil)</option>
                <option value="MS-PL">Microsoft Public License</option>
                <option value="MS-RL">Microsoft Reciprocal License</option>
                <option value="CNRI-Python">CNRI Python License</option>
                <option value="Watcom-1.0">Sybase Open Watcom Public License 1.0</option>
                <option value="BlueOak-1.0.0">Blue Oak Model License 1.0.0</option>
                <option value="NCSA">University of Illinois/NCSA Open Source License</option>
                <option value="W3C">W3C Software Notice and Document License</option>
                <option value="Fair">Fair License</option>
                <option value="HPND">Historical Permission Notice and Disclaimer</option>
                <option value="MulanPSL-2.0">Mulan Permissive Software License v2</option>
                <option value="EUPL-1.2">European Union Public Licence 1.2</option>
                <option value="OSL-3.0">Open Software License 3.0</option>
                <option value="OSL-2.1">Open Software License 2.1</option>
                <option value="OSL-1.0">Open Software License 1.0</option>
                <option value="CC-BY-4.0">Creative Commons Attribution 4.0 International</option>
                <option value="CC-BY-SA-4.0">Creative Commons Attribution-ShareAlike 4.0 International</option>
                <option value="CC-BY-NC-4.0">Creative Commons Attribution-NonCommercial 4.0 International</option>
                <option value="CC-BY-ND-4.0">Creative Commons Attribution-NoDerivatives 4.0 International</option>
                <option value="CC-BY-NC-SA-4.0">Creative Commons Attribution-NonCommercial-ShareAlike 4.0</option>
                <option value="Beerware">The Beer-Ware License (Revision 42)</option>
                <option value="PostgreSQL">PostgreSQL License</option>
                <option value="UPL-1.0">Universal Permissive License v1.0</option>
                <option value="CPL-1.0">Common Public License 1.0</option>
                <option value="RPL-1.5">Reciprocal Public License 1.5</option>
                <option value="IBM-1.0">IBM Public License v1.0</option>
                <option value="AFL-3.0">Academic Free License v3.0</option>
                <option value="Entessa-1.0">Entessa Public License v1.0</option>
                <option value="Frameworx-1.0">Frameworx Public License v1.0</option>
                <option value="MirOS">The MirOS Licence</option>
                <option value="Multics">Multics License</option>
                <option value="Naumen">Naumen Public License</option>
                <option value="Nokia-1.0">Nokia Open Source License</option>
                <option value="Real-1.0">RealNetworks Public Source License v1.0</option>
                <option value="Ricoh-1.0">Ricoh Source Code Public License</option>
                <option value="SimPL-2.0">Simple Public License 2.0</option>
                <option value="SISSL">Sun Industry Standards Source License</option>
                <option value="SPL-1.0">Sun Public License v1.0</option>
                <option value="Xnet">X.Net License</option>
            </select>
        </div>
        <div>
            <label>Platform User/Org <span style="font-weight:normal; opacity:0.5;">(Optional)</span></label>
            <input type="text" id="user" placeholder="math12393">
        </div>
        <div>
            <label>Repository / Model Name <span style="font-weight:normal; opacity:0.5;">(Optional)</span></label>
            <input type="text" id="repo" placeholder="my-project">
        </div>
        <div class="full">
            <label>Project Files <span style="font-weight:normal; opacity:0.5;">(What files are in your repo?)</span></label>
            <input type="text" id="files" placeholder="e.g. index.html, config.json, model.safetensors, main.py">
        </div>
        <div class="full">
            <label>Project Intent / Prompt <span style="font-weight:normal; opacity:0.5;">(Tell Tom what to build)</span></label>
            <textarea id="prompt" rows="3" placeholder="Describe your repository, model, or dataset..."></textarea>
        </div>
    </div>

    <div class="options-row">
        <input type="checkbox" id="deepSearch" style="width: 20px;">
        <span>Enable Deep Search (For 24/7 search when building)</span>
    </div>

    <button id="execBtn" onclick="initiateBuild()">Initiate Master Build</button>

    <div id="terminal" class="terminal"></div>

    <div id="results" class="results-area">
        <div class="file-box full">
            <label>README.md</label>
            <button class="copy-btn" onclick="copy('outReadme')">Copy</button>
            <pre id="outReadme"></pre>
        </div>
        <div class="file-box">
            <label>LICENSE</label>
            <button class="copy-btn" onclick="copy('outLicense')">Copy</button>
            <pre id="outLicense"></pre>
        </div>
        <div class="file-box">
            <label>.gitignore</label>
            <button class="copy-btn" onclick="copy('outGit')">Copy</button>
            <pre id="outGit"></pre>
        </div>
    </div>
</div>

<script>
const term = document.getElementById('terminal');
    const log = (msg) => { term.style.display = 'block'; term.innerHTML += `> <span style="color:#8b949e">[${new Date().toLocaleTimeString()}]</span> ${msg}<br>`; term.scrollTop = term.scrollHeight; };

    async function initiateBuild() {
        log("Booting Architect Engine...");
        const btn = document.getElementById('execBtn');
        btn.disabled = true;

        try {
            const vRes = await fetch('https://tiny-firefly-658d.wen471942.workers.dev/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Nexus-Auth': 'Nexus_Secret_2026'
                }
            });

            if (!vRes.ok) throw new Error("Vault Authentication Failed: " + vRes.status);
            const keys = await vRes.json();
            log("Nexus Vault Authenticated.");

            let searchContext = "";
            if(document.getElementById('deepSearch').checked) {
                log("Agent performing Deep Search for tech stack patterns...");
                const sRes = await fetch('https://google.serper.dev/search', {
                    method: 'POST',
                    headers: { 'X-API-KEY': keys.serper, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ q: (document.getElementById('platform').value) + " repository best practices 2026" })
                });
                const sData = await sRes.json();
                searchContext = sData.organic.map(o => o.snippet).join(" ");
            }

            const user = document.getElementById('user').value || "math12393";
            const repo = document.getElementById('repo').value || "unnamed-project";
            const files = document.getElementById('files').value || "unknown files";
            const prompt = document.getElementById('prompt').value || "A standard project.";
            const platform = document.getElementById('platform').value || "GitHub";
            const license = document.getElementById('license').value || "MIT";

            log(`Compiling architectural blueprint for ${platform}...`);
            log(`Enforcing ${license} license constraints...`);

            const aiRes = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${keys.groq}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: 'openai/gpt-oss-120b',
                    messages: [
                        {
                            role: 'system',
                            content: `
You are the Nexus Architect — an elite Senior Developer and Repository Strategist.

Your task is to generate clean, professional, commit-ready repository files.
The target platform is ${platform}. You must aggressively adapt your output to the specific architectural standards of this platform.

PLATFORM SPECIFIC INSTRUCTIONS:
- IF PLATFORM IS "HUGGINGFACE" (or similar): The README.md MUST begin with a valid YAML metadata block (--- ... ---) containing standard HuggingFace Model Card or Dataset Card attributes (e.g., license: ${license.toLowerCase()}, language, tags, datasets). The body must follow standard ML Model Card formatting (Model Details, Intended Use, Training Data, Metrics).
- IF PLATFORM IS "GITHUB" / "GITLAB" / "CODEBERG": Use standard software engineering README structures (Badges, Installation, Usage, Contributing) specific to that platform's flavor of markdown and URL structures.

CRITICAL REQUIREMENT: The current year is 2026. Use 2026 for all copyright notices.

Search context (if any):
${searchContext}
                            `.trim()
                        },
                        {
                            role: 'user',
                            content: `
Create EXACTLY THREE files.

Project details:
- Owner/User: ${user}
- Repository name: ${repo}
- Target Platform: ${platform}
- Selected License: ${license}
- Existing files (if any): ${files}
- Project description: ${prompt}

Files to generate:
1. README.md (Platform-native format)
2. LICENSE (Generate the exact legal boilerplate for ${license}. Replace year with 2026 and copyright holder with ${user})
3. .gitignore (Tailored to the likely tech stack based on the files and description provided)

Requirements:
- Ensure everything is ready to commit without modification.
- Do NOT include explanations or extra text outside the XML tags.
- Maximize content depth and length INSIDE the generated files.
- ALWAYS INLCUDE THE RESPOSITORY LINK ON THE USAGE ON THE README.MD
- IF THERE IS A index.html, Then include the url to the static website: example: codeberg = codeberg.page, github = github.io, gitlab = gitlab.io, huggingface = hf.space

STRICT OUTPUT FORMAT:
<readme>
README.md content here
</readme>

<license>
${license} License content here
</license>

<gitignore>
.gitignore content here
</gitignore>
                            `.trim()
                        }
                    ],
                    temperature: 0.2
                })
            });

            const data = await aiRes.json();
            const text = data.choices[0].message.content;

            document.getElementById('outReadme').textContent = text.match(/<readme>([\s\S]*?)<\/readme>/)[1].trim();
            document.getElementById('outLicense').textContent = text.match(/<license>([\s\S]*?)<\/license>/)[1].trim();
            document.getElementById('outGit').textContent = text.match(/<gitignore>([\s\S]*?)<\/gitignore>/)[1].trim();

            document.getElementById('results').style.display = 'grid';
            log("Build successful. Results rendered.");
        } catch (e) {
            log("CRITICAL ERROR: " + e.message);
        } finally {
            btn.disabled = false;
        }
    }

    function copy(id) {
        navigator.clipboard.writeText(document.getElementById(id).textContent);
        const btn = document.querySelector(`button[onclick="copy('${id}')"]`);
        const originalText = btn.textContent;
        btn.textContent = "Copied!";
        btn.style.background = "#238636";
        setTimeout(() => {
            btn.textContent = originalText;
            btn.style.background = "#30363d";
        }, 2000);
    }
</script>
</body>
</html>
