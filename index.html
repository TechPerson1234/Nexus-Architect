<style>

}
body.light{

*{ -webkit-box-sizing:border-box; box-sizing:border-box; }
html,body{ margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body{

button,input,select,textarea{ font-family:inherit; }

.topbar{

}

  display:-webkit-box; display:-webkit-flex; display:flex;

}

  display:-webkit-box; display:-webkit-flex; display:flex;

.container{

.url-preview{

  padding:10px 13px; font-size:12.5px; color:var(--muted); margin:0 0 16px;
  word-break:break-all; line-height:1.7;
}
.url-preview b{ color:var(--text); font-weight:600; }
.url-preview code{ color:var(--link); font-family:'Courier New',monospace; font-size:12px; }

.form-grid{
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-flex-wrap:wrap; flex-wrap:wrap; margin:0 -8px;
}
.field{ width:50%; padding:0 8px; }
.field.full{ width:100%; }
label{ display:block; margin:14px 0 6px; font-weight:600; font-size:13.5px; }
label .hint{ font-weight:400; opacity:.55; font-size:11.5px; }
input[type=text], textarea, select{
  width:100%; background:var(--input); border:1px solid var(--border);
  border-radius:7px; padding:12px; color:var(--text); font-size:15px;
  -webkit-appearance:none; appearance:none; border-radius:7px;
}
textarea{ resize:vertical; min-height:74px; line-height:1.5; }
input:focus, textarea:focus, select:focus{ border-color:var(--link); outline:none; }
select{
  cursor:pointer; padding-right:34px;
  background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b949e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat:no-repeat; background-position:right 10px center; background-size:15px;
}
.counter{ text-align:right; font-size:11.5px; color:var(--muted); margin-top:4px; }

.chips{ margin-top:10px; }
.chip{
  display:inline-block; background:var(--card2); border:1px solid var(--border);
  color:var(--muted); border-radius:16px; padding:5px 12px; font-size:12px;
  margin:0 6px 6px 0; cursor:pointer; font-weight:600;
  -webkit-appearance:none; appearance:none; transition:.15s;
}
.chip:hover{ border-color:var(--accent); color:var(--accent); }
.chip.on{ border-color:var(--accent); color:#fff; background:var(--accent); }

.section-title{
  margin:26px 0 4px; font-size:12px; letter-spacing:1.2px;
  text-transform:uppercase; color:var(--muted); font-weight:700;
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-align-items:center; align-items:center;
}
.section-title:after{
  content:''; -webkit-flex:1; flex:1; height:1px; background:var(--border); margin-left:12px;
}
.section-title .mini{
  margin-left:10px; font-size:11px; letter-spacing:0; text-transform:none;
  background:var(--card2); border:1px solid var(--border); color:var(--muted);
  border-radius:12px; padding:2px 9px; cursor:pointer; font-weight:600;
}
.section-title .mini:hover{ color:var(--accent); border-color:var(--accent); }

.artifact-grid{
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-flex-wrap:wrap; flex-wrap:wrap; margin:6px -6px 0;
}
.artifact{
  width:33.3333%; padding:0 6px; margin:6px 0;
}
.artifact label{
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-align-items:flex-start; align-items:flex-start;
  background:var(--card2); border:1px solid var(--border); border-radius:8px;
  padding:9px 11px; margin:0; cursor:pointer; font-size:12.5px; font-weight:500;
  transition:.15s; min-height:46px;
}
.artifact label:hover{ border-color:var(--accent); }
.artifact input[type=checkbox]{
  width:16px; height:16px; margin:2px 9px 0 0; -webkit-flex:0 0 auto; flex:0 0 auto;
  -webkit-appearance:checkbox; appearance:checkbox;
}
.artifact .fname{ word-break:break-all; line-height:1.4; }
.artifact .flock{ color:var(--muted); font-size:10px; display:block; }
.artifact input:checked + .fname{ color:var(--accent3); font-weight:600; }

.options-row{
  background:var(--card2); border:1px solid var(--border); border-radius:9px;
  padding:12px 14px; margin:20px 0 16px;
}
.opt{
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-align-items:center; align-items:center; margin:8px 0; font-size:13.5px;
  cursor:pointer;
}
.opt input[type=checkbox]{
  width:18px; height:18px; margin:0 10px 0 0; -webkit-flex:0 0 auto; flex:0 0 auto;
  -webkit-appearance:checkbox; appearance:checkbox;
}
.opt .txt{ line-height:1.35; }
.opt .txt small{ display:block; color:var(--muted); font-size:11.5px; font-weight:400; }

#execBtn{
  background:var(--accent); color:#fff; border:none; padding:17px;
  border-radius:8px; cursor:pointer; font-size:16px; font-weight:700;
  width:100%; -webkit-appearance:none; appearance:none; transition:.2s;
  letter-spacing:.3px;
}
#execBtn:hover{ background:var(--accent2); }
#execBtn:active{ -webkit-transform:scale(.99); transform:scale(.99); }
#execBtn:disabled{ opacity:.5; cursor:not-allowed; }
.btn-row{ display:-webkit-box; display:-webkit-flex; display:flex; -webkit-flex-wrap:wrap; flex-wrap:wrap; margin:10px -5px 0; }
.btn-row .ghost-btn{ -webkit-flex:1; flex:1; min-width:140px; margin:5px; text-align:center; }

.progress-wrap{ display:none; margin-top:16px; }
.progress-wrap.on{ display:block; }
.progress-bar{
  height:7px; background:var(--card2); border-radius:6px; overflow:hidden;
  border:1px solid var(--border);
}
.progress-fill{
  height:100%; width:0%; border-radius:6px;
  background:-webkit-linear-gradient(90deg,#238636,#58a6ff);
  background:linear-gradient(90deg,#238636,#58a6ff);
  transition:width .35s ease;
}
.progress-label{ font-size:12px; color:var(--muted); margin-top:7px; display:block; }

.terminal{
  background:var(--code); color:#00ff41; padding:14px; border-radius:8px;
  font-family:'Courier New',Courier,monospace; margin-top:20px;
  border:1px solid #333; display:none; height:170px; overflow-y:auto;
  -webkit-overflow-scrolling:touch; font-size:12.5px; line-height:1.65;
  word-break:break-word;
}
.terminal .ts{ color:#8b949e; }
.terminal .ok{ color:#3fb950; }
.terminal .err{ color:#f85149; }
.terminal .warn{ color:#d29922; }
.terminal .info{ color:#58a6ff; }

.results-area{ margin-top:26px; display:none; }
.results-area.on{ display:block; }
.results-head{
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-flex-wrap:wrap; flex-wrap:wrap;
  -webkit-align-items:center; align-items:center;
  -webkit-justify-content:space-between; justify-content:space-between;
  margin-bottom:14px;
}
.results-head strong{ font-size:15px; }
.results-head .meta{ font-size:12px; color:var(--muted); }
.file-box{
  background:var(--card2); padding:0; border-radius:9px;
  border:1px solid var(--border); position:relative; margin-bottom:14px;
  overflow:hidden;
}
.file-head{
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-flex-wrap:wrap; flex-wrap:wrap;
  -webkit-align-items:center; align-items:center;
  -webkit-justify-content:space-between; justify-content:space-between;
  padding:9px 11px; background:rgba(110,118,129,.08);
  border-bottom:1px solid var(--border);
}
.file-name{
  font-family:'Courier New',Courier,monospace; font-size:12.5px;
  font-weight:700; color:var(--accent3); word-break:break-all; padding-right:10px;
}
.file-meta{ font-size:11px; color:var(--muted); }
.file-actions{ display:-webkit-box; display:-webkit-flex; display:flex; }
.mini-btn{
  background:var(--border); color:var(--text); border:none; padding:5px 11px;
  border-radius:5px; cursor:pointer; font-size:11px; font-weight:700;
  margin-left:6px; -webkit-appearance:none; appearance:none; transition:.18s;
}
.mini-btn:hover{ background:#4b535d; color:#fff; }
.mini-btn.done{ background:var(--accent); color:#fff; }
pre{
  font-size:12.5px; line-height:1.6; color:var(--text); white-space:pre-wrap;
  word-wrap:break-word; margin:0; padding:13px; font-family:'Courier New',Courier,monospace;
  max-height:420px; overflow:auto; -webkit-overflow-scrolling:touch;
}
body.light pre{ color:#1f2328; }

.chat-fab{
  position:fixed; right:16px; bottom:16px; z-index:9000;
  width:58px; height:58px; border-radius:50%; border:none; cursor:pointer;
  background:-webkit-linear-gradient(135deg,#238636,#58a6ff);
  background:linear-gradient(135deg,#238636,#58a6ff);
  color:#fff; font-size:24px; box-shadow:0 8px 26px rgba(0,0,0,.45);
  -webkit-appearance:none; appearance:none; transition:-webkit-transform .2s;
  transition:transform .2s;
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-align-items:center; align-items:center;
  -webkit-justify-content:center; justify-content:center;
  padding-bottom:2px;
}
.chat-fab:active{ -webkit-transform:scale(.92); transform:scale(.92); }
.chat-fab .pulse{
  position:absolute; top:6px; right:6px; width:12px; height:12px;
  border-radius:50%; background:var(--accent3); border:2px solid var(--bg);
}
.chat-panel{
  position:fixed; right:16px; bottom:86px; z-index:9001;
  width:380px; max-width:calc(100vw - 32px); height:540px; max-height:calc(100vh - 120px);
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  box-shadow:0 18px 50px rgba(0,0,0,.6);
  display:none; -webkit-flex-direction:column; flex-direction:column; overflow:hidden;
}
.chat-panel.on{ display:-webkit-box; display:-webkit-flex; display:flex; }
.chat-head{
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-align-items:center; align-items:center;
  -webkit-justify-content:space-between; justify-content:space-between;
  padding:11px 13px; border-bottom:1px solid var(--border); background:var(--card2);
  -webkit-flex:0 0 auto; flex:0 0 auto;
}
.chat-title{ font-size:13.5px; font-weight:700; display:-webkit-box; display:-webkit-flex; display:flex; -webkit-align-items:center; align-items:center; }
.chat-dot{
  width:9px; height:9px; border-radius:50%; background:var(--accent3);
  margin-right:8px; display:inline-block;
}
.chat-icon-btn{
  background:transparent; border:1px solid var(--border); color:var(--muted);
  border-radius:6px; width:30px; height:30px; cursor:pointer; margin-left:6px;
  font-size:14px; line-height:1; -webkit-appearance:none; appearance:none;
}
.chat-icon-btn:hover{ color:var(--accent); border-color:var(--accent); }
.chat-log{
  -webkit-flex:1; flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:13px; display:block;
}
.msg{ margin-bottom:12px; display:-webkit-box; display:-webkit-flex; display:flex; }
.msg.me{ -webkit-justify-content:flex-end; justify-content:flex-end; }
.bubble{
  max-width:82%; padding:9px 12px; border-radius:12px; font-size:13.5px;
  line-height:1.55; white-space:pre-wrap; word-wrap:break-word;
}
.msg.bot .bubble{ background:var(--card2); border:1px solid var(--border); border-bottom-left-radius:4px; }
.msg.me .bubble{ background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
.msg.sys .bubble{ background:transparent; border:1px dashed var(--border); color:var(--muted); font-size:12px; max-width:100%; }
.typing span{
  display:inline-block; width:6px; height:6px; border-radius:50%;
  background:var(--muted); margin-right:3px;
  -webkit-animation:blink 1.2s infinite; animation:blink 1.2s infinite;
}
.typing span:nth-child(2){ -webkit-animation-delay:.2s; animation-delay:.2s; }
.typing span:nth-child(3){ -webkit-animation-delay:.4s; animation-delay:.4s; }
@-webkit-keyframes blink{ 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }
@keyframes blink{ 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }
.chat-quick{
  padding:0 11px 8px; display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-flex-wrap:wrap; flex-wrap:wrap; -webkit-flex:0 0 auto; flex:0 0 auto;
}
.chat-quick .chip{ font-size:11px; padding:4px 10px; margin:0 5px 5px 0; }
.chat-form{
  display:-webkit-box; display:-webkit-flex; display:flex;
  border-top:1px solid var(--border); padding:9px; background:var(--card2);
  -webkit-flex:0 0 auto; flex:0 0 auto;
}
.chat-form textarea{
  -webkit-flex:1; flex:1; min-height:42px; max-height:110px; resize:none;
  padding:10px 11px; font-size:14px; border-radius:8px; margin:0;
}
.chat-form button{
  background:var(--accent); color:#fff; border:none; border-radius:8px;
  padding:0 16px; margin-left:8px; font-weight:700; font-size:13.5px;
  cursor:pointer; -webkit-appearance:none; appearance:none; -webkit-flex:0 0 auto; flex:0 0 auto;
}
.chat-form button:disabled{ opacity:.5; }

.toast-wrap{
  position:fixed; left:50%; bottom:24px; z-index:9999;
  -webkit-transform:translateX(-50%); transform:translateX(-50%);
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-flex-direction:column; flex-direction:column;
  -webkit-align-items:center; align-items:center; pointer-events:none;
  width:calc(100% - 32px); max-width:420px;
}
.toast{
  background:var(--card); border:1px solid var(--border); color:var(--text);
  border-radius:9px; padding:11px 16px; font-size:13px; margin-top:8px;
  box-shadow:0 10px 30px rgba(0,0,0,.5); opacity:0;
  -webkit-transition:opacity .25s,transform .25s; transition:opacity .25s,transform .25s;
  -webkit-transform:translateY(10px); transform:translateY(10px);
  max-width:100%; text-align:center;
}
.toast.on{ opacity:1; -webkit-transform:translateY(0); transform:translateY(0); }
.toast.ok{ border-color:var(--accent); }
.toast.err{ border-color:var(--danger); }

@media (max-width:860px){
  .artifact{ width:50%; }
}
@media (max-width:720px){
  body{ padding:10px 10px 120px; font-size:14.5px; }
  .container{ padding:16px; border-radius:9px; }
  .field{ width:100%; }
  .artifact{ width:100%; }
  .brand h1{ font-size:16px; }
  .logo{ width:36px; height:36px; font-size:16px; border-radius:9px; }
  .chat-panel{
    left:8px; right:8px; bottom:78px; width:auto; max-width:none;
    height:calc(100vh - 110px); max-height:calc(100vh - 110px);
    border-radius:12px;
  }
  .chat-fab{ width:54px; height:54px; font-size:22px; right:12px; bottom:12px; }
  pre{ max-height:320px; font-size:12px; }
  .terminal{ height:150px; }
  .btn-row .ghost-btn{ min-width:100%; }
}
@media (max-width:380px){
  .brand .sub{ display:none; }
  .status-badge{ font-size:10.5px; }
}
</style>
</head>

  function copyText(text){
    return new Promise(function(resolve, reject){
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(resolve, function(){ fallback(); });
      } else {
        fallback();
      }
      function fallback(){
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly','');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.left = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('Copy not supported'));
        } catch(e){
          reject(e);
        }
      }
    });
  }

  function cleanContent(s){
    var out = String(s == null ? '' : s);
    out = out.replace(/^\uFEFF/, '');
    out = out.replace(/^\s*```[a-zA-Z0-9+#._-]*\s*\r?\n/, '');
    out = out.replace(/\r?\n```\s*$/, '');
    out = out.replace(/^\s*<<<END>>>\s*$/gm, '');
    out = out.replace(/^\s*(?:File:?\s*)?(?:\.\/)?[\w./-]+\s*\r?\n/, function(m){
      return /[\\/.]/.test(m) && m.length < 80 ? '' : m;
    });
    return out.replace(/[ \t]+$/, '').replace(/\s+$/, '') + '\n';
  }

  function parseBlocks(text){
    var found = [];
    var re = /<<<FILE:([^>\r\n]+?)>>>([\s\S]*?)<<<END>>>/g;
    var m;
    while((m = re.exec(text)) !== null){
      found.push({ path: m[1].trim(), content: cleanContent(m[2]) });
    }
    if(!found.length){
      var re2 = /<file\s+path=["']([^"']+)["']\s*>([\s\S]*?)<\/file>/gi;
      while((m = re2.exec(text)) !== null){
        found.push({ path: m[1].trim(), content: cleanContent(m[2]) });
      }
    }
    return found;
  }

  function runSequential(tasks){
    var i = 0;
    function next(){
      if(i >= tasks.length){ return Promise.resolve(); }
      var task = tasks[i++];
      return Promise.resolve().then(task).then(next);
    }
    return next();
  }

  function localLicense(name, user){
    var tpl = LOCAL_LICENSES[name];
    if(!tpl){ return null; }
    return tpl.split('{year}').join(String(YEAR)).split('{user}').join(user);
  }

  function fetchGitHubLicense(name, user){
    var key = GH_KEYS[name];
    if(!key){ return Promise.reject(new Error('no key')); }
    return fetch('https://api.github.com/licenses/' + key, {
      headers: { 'Accept': 'application/vnd.github+json' }
    }).then(function(res){
      if(!res.ok){ throw new Error('GitHub license lookup failed'); }
      return res.json();
    }).then(function(data){
      var body = String(data.body || '');
      if(!body){ throw new Error('empty license body'); }
      body = body.split('[year]').join(String(YEAR)).split('[fullname]').join(user);
      body = body.split('[yyyy]').join(String(YEAR)).split('[name of copyright owner]').join(user);
      return body;
    });
  }

  function generateLicense(ctx){
    var local = localLicense(ctx.license, ctx.user);
    if(local){
      log('LICENSE resolved from built-in ' + ctx.license + ' template.', 'ok');
      return Promise.resolve(local);
    }
    log('Fetching official ' + ctx.license + ' text...', 'info');
    return fetchGitHubLicense(ctx.license, ctx.user)
      .then(function(body){
        log('LICENSE fetched from the SPDX registry.', 'ok');
        return body;

  function utf8Bytes(str){
    var out = [];
    for(var i = 0; i < str.length; i++){
      var c = str.charCodeAt(i);
      if(c < 0x80){ out.push(c); }
      else if(c < 0x800){ out.push(0xC0 | (c >> 6), 0x80 | (c & 63)); }
      else if(c >= 0xD800 && c <= 0xDBFF && i + 1 < str.length){
        var c2 = str.charCodeAt(i + 1);
        var cp = 0x10000 + ((c - 0xD800) << 10) + (c2 - 0xDC00);
        out.push(0xF0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
        i++;
      } else {
        out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
      }
    }
    return new Uint8Array(out);
  }

  var CRC_TABLE = (function(){
    var t = new Uint32Array(256);
    for(var n = 0; n < 256; n++){
      var c = n;
      for(var k = 0; k < 8; k++){
        c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      }
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes){
    var c = 0xFFFFFFFF;
    for(var i = 0; i < bytes.length; i++){
      c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    }
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function u16(v){ return new Uint8Array([v & 0xFF, (v >>> 8) & 0xFF]); }
  function u32(v){ return new Uint8Array([v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF]); }

  function concatBytes(list){
    var total = 0;
    for(var i = 0; i < list.length; i++){ total += list[i].length; }
    var out = new Uint8Array(total);
    var off = 0;
    for(var j = 0; j < list.length; j++){
      out.set(list[j], off);
      off += list[j].length;
    }
    return out;
  }

  function makeZip(files){
    var now = new Date();
    var dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2)) & 0xFFFF;
    var dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;

    var localParts = [];
    var centralParts = [];
    var offset = 0;

    for(var i = 0; i < files.length; i++){
      var nameBytes = utf8Bytes(files[i].path);
      var dataBytes = utf8Bytes(files[i].content);
      var crc = crc32(dataBytes);

      var local = concatBytes([
        u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(dosTime), u16(dosDate),
        u32(crc), u32(dataBytes.length), u32(dataBytes.length),
        u16(nameBytes.length), u16(0), nameBytes, dataBytes
      ]);
      localParts.push(local);

      var central = concatBytes([
        u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(dosTime), u16(dosDate),
        u32(crc), u32(dataBytes.length), u32(dataBytes.length),
        u16(nameBytes.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset), nameBytes
      ]);
      centralParts.push(central);

      offset += local.length;
    }

    var centralBytes = concatBytes(centralParts);
    var end = concatBytes([
      u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
      u32(centralBytes.length), u32(offset), u16(0)
    ]);

    var all = concatBytes(localParts.concat([centralBytes, end]));
    return new Blob([all], { type: 'application/zip' });
  }

  function saveBlob(blob, filename){
    try {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.rel = 'noopener';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 1500);
      return true;
    } catch(e){
      return false;
    }
  }

  function runBuild(){
    if(state.running){ return; }
    var ctx = buildContext();

    if(!ctx.repo || ctx.repo === 'unnamed-project'){
      toast('Add a repository name for better results', 'err');
    }

    state.running = true;
    state.files = [];
    execBtn.disabled = true;
    execBtn.textContent = 'Building...';
    termEl.innerHTML = '';
    resultsEl.innerHTML = '';
    resultsEl.className = 'results-area';
    progressWrap.className = 'progress-wrap on';
    setProgress(0, 1, 'Booting');

    var artifacts = selectedArtifacts();
    var queue = [];
    var results = [];
    var totalUnits = artifacts.length + 6;

    log('Nexus Architect ' + YEAR + ' online.', 'ok');
    log('Platform: ' + ctx.platform + ' | License: ' + ctx.license + ' | Owner: ' + ctx.user, 'info');
    log('Artifacts queued: ' + artifacts.length, 'info');

    queue.push(function(){
      setProgress(1, totalUnits, 'Resolving LICENSE');
      log('Resolving LICENSE for ' + ctx.license + '...', 'info');
      return generateLicense(ctx).then(function(text){
        results.push({ path:'LICENSE', content: text });
        log('LICENSE ready (' + text.length + ' characters).', 'ok');
      });
    });

    queue.push(function(){
      var useDeep = $('optDeepReadme').checked;
      log(useDeep ? 'Generating README with deep multi-pass mode...' : 'Generating README...', 'info');
      setProgress(2, totalUnits, 'Writing README');
      var p = useDeep ? generateReadmeDeep(ctx) : generateReadmeSingle(ctx);
      return p.then(function(text){
        results.push({ path:'README.md', content: text });
        log('README.md ready (' + text.length + ' characters).', 'ok');
      }).catch(function(err){
        log('README generation failed: ' + err.message, 'err');
      });
    });

    var remaining = [];
    for(var i = 0; i < artifacts.length; i++){
      if(artifacts[i].id !== 'readme' && artifacts[i].id !== 'license'){
        remaining.push(artifacts[i]);
      }
    }

    var batches = [];
    for(var b = 0; b < remaining.length; b += 2){
      batches.push(remaining.slice(b, b + 2));
    }

    log('Grouped ' + remaining.length + ' files into ' + batches.length + ' AI request' + (batches.length === 1 ? '' : 's') + '.', 'info');

    for(var bi = 0; bi < batches.length; bi++){
      (function(batch, index){
        queue.push(function(){
          var label = batch.map(function(x){ return x.path; }).join(' + ');
          setProgress(2 + index, totalUnits, 'Writing ' + label);
          log('Request ' + (index + 1) + '/' + batches.length + ': ' + label, 'info');
          return askTom(buildFilePrompt(ctx, batch)).then(function(text){
            var parsed = parseBlocks(text);
            if(!parsed.length){
              log('No markers found in response, retrying files individually.', 'warn');
              return runSequential(batch.map(function(item){
                return function(){
                  return askTom(buildPromptFor(item.id, ctx, artifacts)).then(function(single){
                    var c = cleanContent(single);
                    results.push({ path: item.path, content: c });
                    log(item.path + ' recovered (' + c.length + ' characters).', 'ok');
                  }).catch(function(e){
                    log(item.path + ' failed: ' + e.message, 'err');
                  });
                };
              }));
            }
            for(var pi = 0; pi < parsed.length; pi++){
              results.push({ path: parsed[pi].path, content: parsed[pi].content });
              log(parsed[pi].path + ' ready (' + parsed[pi].content.length + ' characters).', 'ok');
            }
            var missing = [];
            for(var mi = 0; mi < batch.length; mi++){
              var hit = false;
              for(var pj = 0; pj < parsed.length; pj++){
                if(parsed[pj].path.replace(/^\.\//,'') === batch[mi].path){ hit = true; break; }
              }
              if(!hit){ missing.push(batch[mi]); }
            }
            if(missing.length){
              log('Filling ' + missing.length + ' missing file(s) individually.', 'warn');
              return runSequential(missing.map(function(item){
                return function(){
                  return askTom(buildPromptFor(item.id, ctx, artifacts)).then(function(single){
                    var c = cleanContent(single);
                    results.push({ path: item.path, content: c });
                    log(item.path + ' recovered (' + c.length + ' characters).', 'ok');
                  }).catch(function(e){
                    log(item.path + ' failed: ' + e.message, 'err');
                  });
                };
              }));
            }
          }).catch(function(err){
            log('Batch failed: ' + err.message, 'err');
          });
        });
      })(batches[bi], bi);
    }

    queue.push(function(){
      setProgress(totalUnits, totalUnits, 'Rendering');
      var order = [];
      for(var oi = 0; oi < artifacts.length; oi++){
        for(var ri = 0; ri < results.length; ri++){
          if(results[ri].path === artifacts[oi].path){ order.push(results[ri]); break; }
        }
      }
      for(var rj = 0; rj < results.length; rj++){
        var exists = false;
        for(var ok = 0; ok < order.length; ok++){
          if(order[ok].path === results[rj].path){ exists = true; break; }
        }
        if(!exists){ order.push(results[rj]); }
      }
      renderResults(order);
      log('Build complete — ' + order.length + ' files rendered.', 'ok');
      toast('Build complete: ' + order.length + ' files', 'ok');
      if($('optAutoZip').checked && order.length){ downloadZip(); }
      return Promise.resolve();
    });

    runSequential(queue).catch(function(err){
      log('Fatal build error: ' + err.message, 'err');
    }).then(function(){
      state.running = false;
      execBtn.disabled = false;
      execBtn.textContent = 'Initiate Master Build';
      progressLabel.textContent = 'Finished — ' + state.files.length + ' files';
      setTimeout(function(){
        progressWrap.className = 'progress-wrap';
      }, 2500);
    });
  }

    } catch(e){}
    if(prefersLight){
      document.body.className = 'light';
      btn.textContent = 'Dark Mode';
    }
    btn.onclick = function(){
      if(document.body.className === 'light'){
        document.body.className = '';
        btn.textContent = 'Light Mode';
      } else {
        document.body.className = 'light';
        btn.textContent = 'Dark Mode';
      }
      saveSettings();
    };
  }

  function bindForm(){
    var ids = ['platform','license','user','repo','files','prompt'];
    for(var i = 0; i < ids.length; i++){
      (function(id){
        var el = $(id);
        el.addEventListener('input', function(){
          updateCounter();
          updateUrlPreview();
          saveSettings();
        });
        el.addEventListener('change', function(){
          updateCounter();
          updateUrlPreview();
          saveSettings();
        });
      })(ids[i]);
    }
    var opts = ['optBadges','optEmoji','optDeepReadme','optAutoZip','optRemember'];
    for(var j = 0; j < opts.length; j++){
      $(opts[j]).addEventListener('change', saveSettings);
    }
  }

  function init(){
    renderArtifacts();
    renderChips();
    initChat();
    initTheme();
    loadSettings();
    bindForm();
    updateCounter();
    updateUrlPreview();

    execBtn.onclick = runBuild;
    $('zipBtn').onclick = downloadZip;
    $('copyAllBtn').onclick = copyAll;
    $('gitBtn').onclick = showGitPanel;
    $('clearBtn').onclick = function(){
      try { localStorage.removeItem(STORE_KEY); } catch(e){}
      $('platform').value = 'GitHub';
      $('license').value = 'MIT';
      $('user').value = 'math12393';
      $('repo').value = '';
      $('files').value = '';
      $('prompt').value = '';
      $('optBadges').checked = true;
      $('optEmoji').checked = false;
      $('optDeepReadme').checked = true;
      $('optAutoZip').checked = false;
      $('optRemember').checked = true;
      termEl.innerHTML = '';
      termEl.style.display = 'none';
      resultsEl.innerHTML = '';
      resultsEl.className = 'results-area';
      progressWrap.className = 'progress-wrap';
      state.files = [];
      updateCounter();
      updateUrlPreview();
      toast('Workspace reset', 'ok');
    };

    $('selAll').onclick = function(){
      var boxes = document.querySelectorAll('input[data-artifact]');
      for(var i = 0; i < boxes.length; i++){ if(!boxes[i].disabled){ boxes[i].checked = true; } }
      toast('All files selected', 'ok');
    };
    $('selNone').onclick = function(){
      var boxes = document.querySelectorAll('input[data-artifact]');
      for(var i = 0; i < boxes.length; i++){ if(!boxes[i].disabled){ boxes[i].checked = false; } }
      toast('Optional files cleared', 'ok');
    };

    log('Nexus Architect ready. Tom AI Lite endpoint connected.', 'ok');
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
